name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Test Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractcode
    steps:
      - name: Check out AbstractCode
        uses: actions/checkout@v4
        with:
          path: abstractcode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,flow]"

      - name: Test
        run: python -m pytest -q

      - name: Build package
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

  web:
    name: Test and build web package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractcode/web
    steps:
      - name: Check out AbstractCode
        uses: actions/checkout@v4
        with:
          path: abstractcode

      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: abstractcode/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run
