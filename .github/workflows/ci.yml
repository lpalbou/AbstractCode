name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Test the terminal client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Validate crate contents
        run: cargo package --manifest-path tui/Cargo.toml --list

  msrv:
    name: Build at the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tui/Cargo.toml declares rust-version = "1.87", which the locked
      # dependency set requires. Pinning the toolchain here means a dependency
      # bump that raises the real floor fails CI instead of failing a user's
      # `cargo install` after release.
      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

  web:
    name: Test and build the web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # The shared @abstractframework/* packages install from npm like any
      # other dependency. This job deliberately checks out nothing else — if a
      # sibling-repo path alias is ever reintroduced, the build fails here, and
      # web/src/lib/dependency_hygiene.test.ts names the reason.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run
