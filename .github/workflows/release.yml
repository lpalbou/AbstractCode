name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-python:
    name: Test and build Python package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractcode
    steps:
      - name: Check out AbstractCode
        uses: actions/checkout@v4
        with:
          path: abstractcode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,flow]"

      - name: Test
        run: python -m pytest -q

      - name: Build distribution
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload Python distribution
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: abstractcode/dist/*

  test-web:
    name: Test and build web package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractcode/web
    steps:
      - name: Check out AbstractCode
        uses: actions/checkout@v4
        with:
          path: abstractcode

      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: abstractcode/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Validate npm tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

  publish-pypi:
    name: Publish Python package to PyPI
    runs-on: ubuntu-latest
    needs: [test-python, test-web]
    environment:
      name: pypi
      url: https://pypi.org/project/abstractcode/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python distribution
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    name: Publish web package to npm
    runs-on: ubuntu-latest
    needs: [test-python, test-web]
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: abstractcode/web
    steps:
      - name: Check out AbstractCode
        uses: actions/checkout@v4
        with:
          path: abstractcode

      - name: Check out AbstractUIC
        uses: actions/checkout@v4
        with:
          repository: lpalbou/AbstractUIC
          path: abstractuic

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: abstractcode/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate npm package contents
        run: npm pack --dry-run

      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi

      - name: Publish package
        run: npm publish --access public --provenance
