<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Packaging control: one file</title>
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen" width="480" height="360"></canvas>
<script>
// PACKAGING CONTROL. Character-for-character the same game as control-playable,
// with the three modules concatenated into one inline script and the import and
// export keywords removed. Same logic, same identifiers, same line count, same
// everything a reader would call quality — one file instead of three.
//
// It exists because Tier-2 modularity correlates with FILE COUNT at r = +0.940
// across the corpus, and three single-file products score 0.00/5 on it. If this
// fixture and control-playable do not score the same on the source tier, the
// tier is grading a packaging choice.
// ---- stage.js ----------------------------------------------------
// Scrolling stage: two parallax star layers and a striped terrain band top and
// bottom. This is the autonomous motion the rubric's R5/R8 look for, and it is
// also what makes an idle-vs-input comparison impossible on this genre.
const STAGE_W = 480;
const STAGE_H = 360;

const TERRAIN_H = 42;
const STRIPE = 24;
const SCROLL_SPEED = 74;

class Stage {
  constructor() {
    this.scroll = 0;
    this.layers = [];
    for (let layer = 0; layer < 2; layer++) {
      const stars = [];
      for (let i = 0; i < 36; i++) {
        stars.push({
          x: Math.random() * STAGE_W,
          y: Math.random() * STAGE_H,
          size: 1 + layer,
        });
      }
      this.layers.push({ stars: stars, speed: 46 + layer * 88 });
    }
  }

  update(dt) {
    this.scroll += SCROLL_SPEED * dt;
    for (const layer of this.layers) {
      for (const star of layer.stars) {
        star.x -= layer.speed * dt;
        if (star.x < 0) star.x += STAGE_W;
      }
    }
  }

  draw(ctx) {
    ctx.fillStyle = '#04060f';
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    for (const layer of this.layers) {
      ctx.fillStyle = layer.speed > 100 ? '#e6ecff' : '#5d6ea0';
      for (const star of layer.stars) {
        ctx.fillRect(star.x | 0, star.y | 0, star.size, star.size);
      }
    }
    this.drawTerrain(ctx);
  }

  drawTerrain(ctx) {
    const offset = this.scroll % STRIPE;
    for (let x = -STRIPE; x < STAGE_W + STRIPE; x += STRIPE) {
      const px = (x - offset) | 0;
      ctx.fillStyle = '#27472a';
      ctx.fillRect(px, 0, STRIPE - 5, TERRAIN_H);
      ctx.fillStyle = '#38663c';
      ctx.fillRect(px, STAGE_H - TERRAIN_H, STRIPE - 5, TERRAIN_H);
    }
  }

  // The playfield the ship is allowed into: inside the terrain, not through it.
  bounds() {
    return { top: TERRAIN_H + 4, bottom: STAGE_H - TERRAIN_H - 4 };
  }
}

// ---- entities.js -------------------------------------------------
// Ship, shots, enemies, explosions and the pod power-up. Everything here is
// integrated from `dt`, so the fixture exercises the same virtual-clock path the
// real corpus does.

class Ship {
  constructor(bounds) {
    this.x = 96;
    this.y = STAGE_H / 2;
    this.w = 22;
    this.h = 12;
    this.speed = 260;
    this.bounds = bounds;
    this.power = 1;
  }

  move(dx, dy, dt) {
    this.x += dx * this.speed * dt;
    this.y += dy * this.speed * dt;
    this.x = Math.max(8, Math.min(STAGE_W - 140, this.x));
    this.y = Math.max(this.bounds.top, Math.min(this.bounds.bottom, this.y));
  }

  draw(ctx) {
    ctx.fillStyle = '#8fd2ff';
    ctx.fillRect(this.x | 0, (this.y - this.h / 2) | 0, this.w, this.h);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect((this.x + this.w - 6) | 0, (this.y - 2) | 0, 8, 4);
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect((this.x - 5) | 0, (this.y - 2) | 0, 5, 4);
  }
}

class Shot {
  constructor(x, y, power) {
    this.x = x;
    this.y = y;
    this.speed = 430;
    this.power = power;
    this.dead = false;
  }

  update(dt) {
    this.x += this.speed * dt;
    if (this.x > STAGE_W) this.dead = true;
  }

  draw(ctx) {
    ctx.fillStyle = this.power > 1 ? '#ffe066' : '#ff5f5f';
    ctx.fillRect(this.x | 0, this.y | 0, 9 + this.power * 3, 3);
  }
}

class Enemy {
  constructor(y, phase) {
    this.x = STAGE_W + 12;
    this.y = y;
    this.baseY = y;
    this.phase = phase;
    this.age = 0;
    this.speed = 92;
    this.dead = false;
  }

  update(dt) {
    this.age += dt;
    this.x -= this.speed * dt;
    this.y = this.baseY + Math.sin(this.age * 3 + this.phase) * 26;
    if (this.x < -20) this.dead = true;
  }

  hit(shot) {
    return shot.x > this.x - 4 && shot.x < this.x + 18 &&
           shot.y > this.y - 12 && shot.y < this.y + 12;
  }

  draw(ctx) {
    ctx.fillStyle = '#c86bff';
    ctx.fillRect(this.x | 0, (this.y - 8) | 0, 16, 16);
    ctx.fillStyle = '#2a0033';
    ctx.fillRect((this.x + 2) | 0, (this.y - 3) | 0, 5, 5);
  }
}

class Explosion {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.life = 0.42;
    this.dead = false;
    this.bits = [];
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      this.bits.push({ dx: Math.cos(a) * 78, dy: Math.sin(a) * 78 });
    }
  }

  update(dt) {
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }

  draw(ctx) {
    const t = 0.42 - this.life;
    ctx.fillStyle = this.life > 0.2 ? '#fff3b0' : '#ff7a2f';
    for (const bit of this.bits) {
      ctx.fillRect((this.x + bit.dx * t) | 0, (this.y + bit.dy * t) | 0, 3, 3);
    }
  }
}

// Power-up capsule: drifts left, upgrades the weapon when collected.
class Pod {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.dead = false;
  }

  update(dt) {
    this.x -= 60 * dt;
    if (this.x < -12) this.dead = true;
  }

  collected(ship) {
    return Math.abs(this.x - ship.x) < 18 && Math.abs(this.y - ship.y) < 14;
  }

  draw(ctx) {
    ctx.fillStyle = '#63ff9c';
    ctx.fillRect(this.x | 0, this.y | 0, 10, 10);
  }
}

// ---- main.js -----------------------------------------------------
// POSITIVE CONTROL for the R-Type rubric regression suite.
//
// A small but genuinely playable horizontal shooter: the ship answers the
// arrows, Space fires shots that persist and kill enemies, the stage scrolls by
// itself, and sound is scheduled. It exists so that every adversarial fixture in
// this directory can be required to score BELOW it by a recorded margin.

const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const stage = new Stage();
const ship = new Ship(stage.bounds());

const shots = [];
const enemies = [];
const explosions = [];
const pods = [];

const held = Object.create(null);
let cooldown = 0;
let score = 0;
let frame = 0;
let last = -1;
let audio = null;

// Held-key map. keydown/keyup, not keypress: the driver holds a key down for a
// run of frames and the game has to see it for every one of them.
window.addEventListener('keydown', function (e) {
  held[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
window.addEventListener('keyup', function (e) {
  held[e.code] = false;
});

function tone(freq, dur) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.frequency.value = freq;
    gain.gain.value = 0.04;
    osc.connect(gain).connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime + dur);
  } catch (err) {
    audio = null;
  }
}

function fire() {
  shots.push(new Shot(ship.x + ship.w, ship.y - 1, ship.power));
  tone(660, 0.05);
}

function spawnWave() {
  const lane = stage.bounds();
  const span = lane.bottom - lane.top;
  enemies.push(new Enemy(lane.top + ((frame * 37) % span), (frame % 6) * 1.1));
  if (frame % 300 === 120) pods.push(new Pod(STAGE_W, lane.top + span / 2));
}

function collide() {
  for (const shot of shots) {
    for (const enemy of enemies) {
      if (!enemy.dead && !shot.dead && enemy.hit(shot)) {
        enemy.dead = true;
        shot.dead = true;
        score += 100;
        explosions.push(new Explosion(enemy.x, enemy.y));
        tone(180, 0.08);
      }
    }
  }
  for (const pod of pods) {
    if (!pod.dead && pod.collected(ship)) {
      pod.dead = true;
      ship.power = Math.min(3, ship.power + 1);
    }
  }
}

function prune(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].dead) list.splice(i, 1);
  }
}

function hud() {
  ctx.fillStyle = '#dfe9ff';
  ctx.font = '12px monospace';
  ctx.fillText('SCORE ' + score, 8, 14);
  ctx.fillText('POWER ' + ship.power, STAGE_W - 88, 14);
}

function update(dt) {
  const dx = (held.ArrowRight ? 1 : 0) - (held.ArrowLeft ? 1 : 0);
  const dy = (held.ArrowDown ? 1 : 0) - (held.ArrowUp ? 1 : 0);
  ship.move(dx, dy, dt);

  cooldown -= 1;
  if ((held.Space || held.KeyZ) && cooldown <= 0) {
    fire();
    cooldown = 4;
  }

  stage.update(dt);
  for (const shot of shots) shot.update(dt);
  for (const enemy of enemies) enemy.update(dt);
  for (const boom of explosions) boom.update(dt);
  for (const pod of pods) pod.update(dt);
  collide();
  prune(shots);
  prune(enemies);
  prune(explosions);
  prune(pods);

  if (frame % 34 === 0) spawnWave();
  if (frame % 16 === 0) tone(110 + (frame % 4) * 55, 0.12);
}

function render() {
  stage.draw(ctx);
  for (const pod of pods) pod.draw(ctx);
  for (const enemy of enemies) enemy.draw(ctx);
  for (const shot of shots) shot.draw(ctx);
  for (const boom of explosions) boom.draw(ctx);
  ship.draw(ctx);
  hud();
}

function loop(now) {
  if (last < 0) last = now;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  frame++;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>
</body>
</html>
